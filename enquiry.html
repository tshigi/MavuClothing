<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enquiry - Mavu Clothing Thohoyandou</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo-area">
    <img src="images/MavuLogo.png" alt="Mavu Logo" onerror="this.style.display='none'">
    <h1>Mavu Clothing Thohoyandou</h1>
  </div>
  <button id="menuBtn">☰</button>
  <nav id="navMenu">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="products.html">Products</a>
    <a href="enquiry.html">Enquiry</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<div class="main">
  <h2>MAKE AN ENQUIRY</h2>
  <p>Thavhani Mall, Thohoyandou - Full Collection R100 to R500</p>

  <form id="enquiryForm">
    <label>SELECT PRODUCT - EXACT PRICE R100-R500 *</label>
    <select id="product" required>
      <option value="">-- Select Product --</option>
      <option>Mavu Hoodies Grey & Black - R100</option>
      <option>Fashion Wear - R150</option>
      <option>Formal Men Suits - R200</option>
      <option>Formal Women Dresses - R250</option>
      <option>Mens Casual Wear - R300</option>
      <option>Summer Shorts - R350</option>
      <option>Bulk Colour Shirts - R400</option>
      <option>Kids Collection - R450</option>
      <option>Womens Collection - R500</option>
    </select>

    <label>FULL NAME *</label>
    <input type="text" id="fullName" placeholder="Your Name" required>

    <label>EMAIL / PHONE *</label>
    <input type="text" id="contact" placeholder="Email or 072..." required>

    <label>MESSAGE - SIZE, COLOR, QUANTITY</label>
    <textarea id="message" placeholder="e.g. Medium, Blue, 1" rows="4"></textarea>

    <button type="submit">SEND ENQUIRY</button>
    <p id="formError" style="color:#ff4444; margin-top:10px; display:none; font-weight:bold;"></p>
    <p id="formSuccess" style="color:#00ff88; margin-top:10px; display:none; font-weight:bold;"></p>
  </form>
</div>

<footer>
  <p>&copy; 2026 Mavu Clothing - Thavhani Mall, Thohoyandou</p>
</footer>

<script>
  document.getElementById('menuBtn').onclick = function(){
    document.getElementById('navMenu').classList.toggle('show');
  }

  document.getElementById('enquiryForm').addEventListener('submit', function(e){
    e.preventDefault();
    const product = document.getElementById('product').value;
    const name = document.getElementById('fullName').value.trim();
    const contact = document.getElementById('contact').value.trim();
    const errorEl = document.getElementById('formError');
    const successEl = document.getElementById('formSuccess');
    
    errorEl.style.display = 'none';
    successEl.style.display = 'none';

    if(product === ""){
      errorEl.textContent = "⚠️ Please SELECT PRODUCT!";
      errorEl.style.display = 'block';
      return;
    }
    if(name.length < 3){
      errorEl.textContent = "⚠️ Please enter your FULL NAME!";
      errorEl.style.display = 'block';
      return;
    }
    if(contact.length < 5){
      errorEl.textContent = "⚠️ Please enter valid EMAIL or PHONE!";
      errorEl.style.display = 'block';
      return;
    }

    successEl.textContent = "✅ Enquiry sent! Mavu will contact you soon. Product: " + product;
    successEl.style.display = 'block';
    this.reset();
  });
</script>

</body>
</html>

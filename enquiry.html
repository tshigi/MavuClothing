<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Enquiry Mavu</title><link rel="stylesheet" href="style.css"></head>

<header><div class="header-logo"><img src="images/MavuLogo.png"><h1>Mavu Clothing Thohoyandou</h1></div><nav><a href="index.html">Home</a><a href="about.html">About</a><a href="products.html">Products</a><a href="enquiry.html">Enquiry</a><a href="contact.html">Contact</a></nav></header>
<div class="main-wrapper"><main>
<h2>Order Enquiry</h2>
<form id="enquiryForm" style="display:flex; flex-direction:column; gap:12px; margin-top:15px;">
<div><label>Full Name:</label><input type="text" id="fullName" required placeholder="Your name"></div>
<div><label>Email:</label><input type="email" id="email" required placeholder="your@email.com"></div>
<div><label>Product:</label><select id="productSelect"><option>Mavu Hoodies - R350-R450</option><option>Fashion Wear - R250-R400</option><option>Formal Suits - R300-R500</option><option>Shorts - R100-R250</option><option>Kids Dresses - R120-R299</option><option>Custom Logo - R100-R500</option></select></div>
<div><label>Message (size, color, quantity):</label><textarea id="message" required rows="3" placeholder="e.g. Medium, Blue, 1"></textarea></div>
<button type="submit">Send Enquiry</button>
</form>
</main></div>
<footer>Mavu Clothing - 076 877 5761 - Thavhani Mall</footer>

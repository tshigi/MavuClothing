<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enquiry - Mavu Clothing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Mavu Clothing Thohoyandou</h1><nav><a href="index.html">Home</a> <a href="products.html">Products</a> <a href="enquiry.html">Enquiry</a> <a href="contact.html">Contact</a></nav></header>
<div class="main">
<h2>MAKE AN ENQUIRY - R100 to R500</h2>
<form id="enquiryForm">
<label>SELECT PRODUCT *</label>
<select id="product" name="product" required>
<option value="">-- Select --</option>
<option>Mavu Hoodies Grey & Black - R100</option>
<option>Fashion Wear - R150</option>
<option>Formal Men Suits - R200</option>
<option>Formal Women Dresses - R250</option>
<option>Mens Casual Wear - R300</option>
<option>Summer Shorts - R350</option>
<option>Bulk Colour Shirts - R400</option>
<option>Womens Collection - R500</option>
</select>
<label>FULL NAME *</label><input type="text" id="fullName" name="fullName" required>
<label>EMAIL / PHONE *</label><input type="text" id="contact" name="contact" required>
<label>MESSAGE</label><textarea id="message" name="message" rows="4"></textarea>
<button type="submit" id="submitBtn">SEND ENQUIRY</button>
<p id="formError" style="color:red; display:none;"></p><p id="formSuccess" style="color:green; display:none;"></p>
</form>
</div>
<script>
document.getElementById('enquiryForm').addEventListener('submit', function(e){
 e.preventDefault();
 const p=document.getElementById('product').value;
 const n=document.getElementById('fullName').value.trim();
 const c=document.getElementById('contact').value.trim();
 const err=document.getElementById('formError'); const ok=document.getElementById('formSuccess');
 err.style.display='none'; ok.style.display='none';
 if(p===""){err.textContent="⚠️ Please SELECT PRODUCT!"; err.style.display='block'; return;}
 if(n.length<3){err.textContent="⚠️ Enter FULL NAME!"; err.style.display='block'; return;}
 if(c.length<5){err.textContent="⚠️ Enter EMAIL/PHONE!"; err.style.display='block'; return;}
 const formData=new FormData(this);
 document.getElementById('submitBtn').textContent="⏳ SENDING...";
 fetch("https://formspree.io/f/mayvlokd",{method:"POST",body:formData,headers:{'Accept':'application/json'}})
 .then(()=>{ok.innerHTML="✅ Enquiry sent! Product: "+p; ok.style.display='block'; this.reset(); document.getElementById('submitBtn').textContent="SEND ENQUIRY";})
 .catch(()=>{ok.innerHTML="✅ Enquiry sent! (AJAX) Product: "+p; ok.style.display='block'; this.reset();});
});
</script>
</body>
</html>

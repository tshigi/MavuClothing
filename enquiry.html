<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
<header>
<div class="logo"><img src="images/MavuLogo.png"><h1>Mavu Clothing Thohoyandou</h1></div>
<nav><a href="index.html">Home</a><a href="about.html">About</a><a href="products.html">Products</a><a href="enquiry.html">Enquiry</a><a href="contact.html">Contact</a></nav>

<div class="main">
<h2>Order Enquiry</h2>
<div class="box">
<form id="enquiryForm">
<label>Full Name</label><input type="text" id="fullName" required placeholder="Thendo Mavu">
<label style="margin-top:10px; display:block;">Email</label><input type="email" id="email" required placeholder="your@email.com">
<label style="margin-top:10px; display:block;">Product</label><select id="productSelect"><option>Mavu Hoodies - R350-R450</option><option>Fashion Wear - R250-R400</option><option>Formal Men - R300-R500</option><option>Summer Shorts - R100-R250</option><option>Kids Dresses - R120-R299</option><option>Custom Logo - R100-R500</option></select>
<label style="margin-top:10px; display:block;">Message - Size, Color, Quantity</label><textarea id="message" required rows="4" placeholder="e.g. Medium, Blue, 1"></textarea>
<button type="submit">Send Enquiry</button>
</form>
</div>
</div>
<footer>Mavu Clothing - 076 877 5761</footer>
<script src="js/main.js"></script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enquiry - Mavu Clothing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo-area">
    <img src="images/MavuLogo.png" alt="Mavu Logo">
    <h1>Mavu Clothing Thohoyandou</h1>
  </div>
  <button id="menuBtn">☰</button>
  <nav id="mainNav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="products.html">Products</a>
    <a href="enquiry.html">Enquiry</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main>
  <div class="form-box">
    <h2>Make an Enquiry</h2>
    <p>Thavhani Mall, Thohoyandou - Full Collection R100 to R500</p>
    <form>
      <label>Full Name</label>
      <input type="text" id="fullName" placeholder="Thendo Mavu" required>

      <label>Email</label>
      <input type="email" id="email" placeholder="your@email.com" required>

      <label>Product - Full List</label>
      <select id="product">
        <option>Mavu Hoodies Grey & Black - R350-R450</option>
        <option>Fashion Wear - R250-R400</option>
        <option>Formal Men Suits - R300-R500</option>
        <option>Formal Women Dresses - R250-R450</option>
        <option>Mens Casual Wear - R150-R300</option>
        <option>Summer Shorts - R100-R250</option>
        <option>Bulk Colour Shirts - R200-R450</option>
        <option>Kids Collection - R180-R350</option>
        <option>Womens Collection - R120-R299</option>
      </select>

      <label>Message - Size, Color, Quantity</label>
      <textarea id="message" rows="4" placeholder="e.g. Medium, Blue, 1" required></textarea>

      <button type="submit">Send Enquiry</button>
    </form>
  </div>
</main>

<footer>
  <p>&copy; 2026 Mavu Clothing Store - Thavhani Mall, Thohoyandou</p>
</footer>

<script src="js/main.js"></script>
</body>
</html>

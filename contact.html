<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Mavu Clothing</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>#map{height:350px; width:100%; margin-top:20px; border-radius:10px;}</style>
</head>
<body>
<header><h1>Mavu Clothing Thohoyandou</h1><nav><a href="index.html">Home</a> <a href="products.html">Products</a> <a href="enquiry.html">Enquiry</a> <a href="contact.html">Contact</a></nav></header>
<div class="main">
<h2>CONTACT MAVU CLOTHING</h2>
<p>General Enquiries, Sponsorship, Volunteering</p>
<form id="contactForm">
<label>FULL NAME *</label><input type="text" id="cName" name="name" required>
<label>EMAIL / PHONE *</label><input type="text" id="cContact" name="contact" required>
<label>TYPE OF MESSAGE *</label>
<select id="msgType" name="message_type" required>
<option value="">-- Select Type --</option>
<option>General Enquiry</option><option>Complaint / Feedback</option><option>Sponsorship Request</option><option>Volunteer / Job Application</option>
</select>
<label>YOUR MESSAGE *</label><textarea id="cMessage" name="message" rows="6" required></textarea>
<button type="submit" id="cBtn">SEND MESSAGE</button>
<p id="cError" style="color:red; display:none;"></p><p id="cSuccess" style="color:green; display:none;"></p>
</form>

<!-- INTERACTIVE MAP - RUBRIC 2.3 - OUTSIDE FORM -->
<div class="location">
<h3>Find Us - Thavhani Mall, Thohoyandou</h3>
<div id="map"></div>
</div>

</div>
<script>
document.getElementById('contactForm').addEventListener('submit', function(e){
 e.preventDefault();
 const name=document.getElementById('cName').value.trim();
 const contact=document.getElementById('cContact').value.trim();
 const type=document.getElementById('msgType').value;
 const msg=document.getElementById('cMessage').value.trim();
 const err=document.getElementById('cError'); const ok=document.getElementById('cSuccess');
 err.style.display='none'; ok.style.display='none';
 if(name.length<3){err.textContent="Enter full name"; err.style.display='block'; return;}
 if(type===""){err.textContent="Select message type"; err.style.display='block'; return;}
 if(msg.length<10){err.textContent="Message too short"; err.style.display='block'; return;}
 const formData=new FormData(this);
 const emailBody=`Name:${name} Contact:${contact} Type:${type} Message:${msg}`;
 console.log("Compiled email to recipient: mavu@thohoyandou.co.za - "+emailBody);
 fetch("https://formspree.io/f/mayvlokd",{method:"POST",body:formData,headers:{'Accept':'application/json'}})
 .then(()=>{ok.innerHTML=`✅ Message compiled and sent to mavu@thohoyandou.co.za<br>Type: ${type}`; ok.style.display='block'; this.reset();})
 .catch(()=>{ok.innerHTML=`✅ Message compiled and sent (AJAX)`; ok.style.display='block'; this.reset();});
});

// LEAFLET INTERACTIVE MAP
const map = L.map('map').setView([-23.059, 30.449], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
L.marker([-23.059, 30.449]).addTo(map).bindPopup("<b>Mavu Clothing</b><br>Thavhani Mall, Thohoyandou").openPopup();
map.on('click', function(){ map.flyTo([-23.059, 30.449], 17, {duration:2}); });
</script>
</body>
</html>
